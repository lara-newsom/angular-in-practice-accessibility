<section class="content-container">
  <app-header-content mainHeader="Our Rooms">
    <p>Every room is a sanctuary of comfort, thoughtfully designed with modern aesthetics and essential amenities to ensure a restful and productive stay.</p>
  </app-header-content>
  <app-sub-header-content subHeaderContentTitle="In-Room Amenities">
    <ul class="amenities-list">
      @for (amenity of amenities; track amenity) {
        <li>{{ amenity }}</li>
      }
    </ul>
  </app-sub-header-content>
  <app-image-link-wrapper
    linkWrapperTitle="Explore Our Room Types"
    [imageLinks]="rooms">
  </app-image-link-wrapper>
</section>
