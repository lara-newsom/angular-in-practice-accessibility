<div class="site-header">
  <div class="logo">
    <div routerLink="/">
      <img ngSrc="assets/logos/logo.svg" alt="" width="80" height="80">
      <span class="logo-text">The Every Hotel</span>
    </div>
  </div>
  <div class="main-nav">
    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()">
      <span class="sr-only">Menu</span>
      <span class="hamburger"></span>
    </button>
    <ul class="nav-links" [class.is-open]="isMenuOpen()">
      <li><div routerLink="/home">Home</div></li>
      <li><div routerLink="/rooms">Rooms</div></li>
      <li><div routerLink="/amenities">Amenities</div></li>
      <li><div routerLink="/about">About</div></li>
      <li><div routerLink="/book">Book</div></li>
    </ul>
  </div>
</div>
