<section class="hero">
  <div class="hero-text">
    <img ngSrc="assets/logos/logo.svg" alt="" width="300" height="300" class="hero-logo" priority>
    <h1>Welcome to The Every Hotel</h1>
    <p>Your perfect stay, designed for the modern traveler. Experience comfort, convenience, and style in the heart of the city.</p>
    <img ngSrc="assets/logos/key.svg" alt="" width="176" height="71" class="key-divider">
    <a routerLink="/rooms" class="styled-button">Explore Our Rooms</a>
  </div>
</section>

<section class="photo-gallery">
  <h2>A Glimpse of Our Hotel</h2>
  <div class="gallery-container">
    @for (image of galleryImages(); track image.src) {
      <div class="gallery-item">
        <a [routerLink]="image.route" >
          <!-- Removed alt text because it didn't add helpful details -->
          <img [ngSrc]="image.src" [alt]="" width="375" height="500" class="gallery-image" priority>
          <span class="gallery-cta">{{ image.cta }}</span>
        </a>
      </div>
    }
  </div>
</section>
