<section class="hero">
  <div class="hero-text">
    <img ngSrc="assets/logos/logo.svg" alt="" width="300" height="300" class="hero-logo" priority>
    <h1>Welcome to The Every Hotel</h1>
    <p>Your perfect stay, designed for the modern traveler. Experience comfort, convenience, and style in the heart of the city.</p>
    <img ngSrc="assets/logos/key.svg" alt="" width="176" height="71" class="key-divider">
    <a routerLink="/rooms" appStyledPulseButton>Explore Our Rooms</a>
  </div>
</section>

<app-image-link-wrapper
  [imageLinks]="galleryImages()"
  [linkWrapperTitle]="'A Glimpse of Our Hotel'"
/>
