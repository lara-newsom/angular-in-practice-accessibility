<section class="hero">
  <div class="hero-text">
    <img ngSrc="assets/logos/logo.svg" alt="" width="300" height="300" class="hero-logo" priority>
    <div>Welcome to The Every Hotel</div>
    <div class="p">Your perfect stay, designed for the modern traveler. Experience comfort, convenience, and style in the heart of the city.</div>
    <img ngSrc="assets/logos/key.svg" alt="" width="176" height="71" class="key-divider">
    <div (click)="navigateToRoute('/rooms')" class="cta-button">Explore Our Rooms</div>
  </div>
</section>

<section class="photo-gallery">
  <div>A Glimpse of Our Hotel</div>
  <div class="gallery-container">
    @for (image of galleryImages(); track image.src) {
      <div class="gallery-item">
        <div class="anchor" (click)="navigateToRoute(image.route)" >
          <img [ngSrc]="image.src" [alt]="image.alt" width="375" height="500" class="gallery-image" priority>
          <span class="gallery-cta">{{ image.cta }}</span>
        </div>
      </div>
    }
  </div>
</section>
