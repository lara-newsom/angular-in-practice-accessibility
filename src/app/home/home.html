<section class="hero">
  <div class="hero-text">
    <img
      ngSrc="assets/logos/logo.svg"
      alt=""
      width="300"
      height="300"
      class="hero-logo"
      priority>
    <h1>Welcome to The Every Hotel</h1>
    <p>Your perfect stay, designed for the modern traveler. Experience comfort, convenience, and style in the heart of the city.</p>
    <img
      ngSrc="assets/logos/key.svg"
      alt=""
      width="176"
      height="71"
      class="key-divider"/>
    <a routerLink="/rooms" appStyledButton appPulseButton>Explore Our Rooms</a>
  </div>
</section>

<section class="photo-gallery">
  <h2>A Glimpse of Our Hotel</h2>
  <app-image-link-wrapper
    linkWrapperTitle="Explore Our Amenities:"
    [imageLinks]="galleryImages()">
  </app-image-link-wrapper>
</section>
